name: Feature request
description: Suggest a new feature or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement to MoMoTrack Oracle or the SDK. For provider support, use the **Provider request** template instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem does this solve? Who benefits?
      placeholder: Escrow dApps need batch attestation to reduce on-chain write costs.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - SDK (TypeScript/JavaScript)
        - SDK (React Native)
        - SDK (Flutter)
        - Oracle service
        - Provider adapter
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature
          required: false
